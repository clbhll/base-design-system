name: Release alpha

on:
  push:
    tags:
      - "v*-alpha.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.prepare.outputs.digest }}
      version: ${{ steps.prepare.outputs.version }}
    steps:
      # actions/checkout v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      # pnpm/action-setup v4.3.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.30.3
      # actions/setup-node v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - name: Pin npm
        run: npm install --global npm@11.19.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify repository
        run: pnpm verify
      - name: Fetch main containment reference
        run: git fetch --no-tags origin main
      - name: Prepare exact candidate
        id: prepare
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_OUTPUT_DIRECTORY: ${{ runner.temp }}/base-release-candidate
        run: pnpm release:prepare
      # actions/upload-artifact v4.6.2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: base-release-candidate
          path: ${{ steps.prepare.outputs.path }}
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    outputs:
      version: ${{ needs.verify.outputs.version }}
    steps:
      # actions/setup-node v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Pin npm
        run: npm install --global npm@11.19.0
      # actions/download-artifact v4.3.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: base-release-candidate
          path: candidate
      - name: Verify candidate digest
        id: candidate
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          mapfile -t candidates < <(find candidate -maxdepth 1 -type f -name '*.tgz' -print)
          test "${#candidates[@]}" -eq 1
          candidate_path="$(realpath "${candidates[0]}")"
          actual_digest="$(sha256sum "$candidate_path" | awk '{print $1}')"
          test "$actual_digest" = "${{ needs.verify.outputs.digest }}"
          manifest_path="candidate/candidate-package.json"
          tar -xOf "$candidate_path" package/package.json > "$manifest_path"
          export CANDIDATE_MANIFEST_PATH="$manifest_path"
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          import { isDeepStrictEqual } from "node:util";

          const candidate_manifest = JSON.parse(
            readFileSync(process.env.CANDIDATE_MANIFEST_PATH, "utf8"),
          );
          const expected_repository = {
            type: "git",
            url: "git+https://github.com/clbhll/base-design-system.git",
          };
          const expected_publish_config = {
            registry: "https://registry.npmjs.org",
            access: "public",
            provenance: true,
            tag: "next",
          };
          if (candidate_manifest.name !== "@calebhill/base") {
            throw new Error("Candidate package name mismatch");
          }
          if (candidate_manifest.version !== process.env.RELEASE_VERSION) {
            throw new Error("Candidate package version mismatch");
          }
          if (!isDeepStrictEqual(candidate_manifest.repository, expected_repository)) {
            throw new Error("Candidate package repository mismatch");
          }
          if (!isDeepStrictEqual(candidate_manifest.publishConfig, expected_publish_config)) {
            throw new Error("Candidate package publishConfig mismatch");
          }
          NODE
          echo "path=$candidate_path" >> "$GITHUB_OUTPUT"
      - name: Confirm immutable version is absent
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set +e
          lookup="$(npm view "@calebhill/base@$RELEASE_VERSION" version --json --registry=https://registry.npmjs.org/ 2>&1)"
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Registry version already exists: @calebhill/base@$RELEASE_VERSION" >&2
            exit 1
          fi
          if ! grep -q "E404" <<< "$lookup"; then
            echo "$lookup" >&2
            exit "$status"
          fi
      - name: Publish exact candidate with provenance
        run: npm publish ${{ steps.candidate.outputs.path }} --access public --tag next --provenance

  verify-registry:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      # actions/checkout v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # pnpm/action-setup v4.3.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.30.3
      # actions/setup-node v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - name: Pin npm
        run: npm install --global npm@11.19.0
      - name: Install verifier dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify exact registry artifact
        run: pnpm fixture:registry -- ${{ needs.publish.outputs.version }}
